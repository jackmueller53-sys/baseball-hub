name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage publishable files
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r index.html css js pages _site/
          mkdir -p _site/data
          # Ship runtime JSON; skip model_cache/ (xgboost pickle artifacts) and deploy tooling.
          find data -maxdepth 1 -type f -name '*.json' -exec cp {} _site/data/ \;
          if [ -d data/milb ]; then cp -r data/milb _site/data/milb; fi
          du -sh _site
          echo "── Pre-minify sizes ──"
          du -sh _site/js _site/css
      - name: Minify JS and CSS with esbuild
        run: |
          set -euo pipefail
          # In-place per-file minification — preserves script tag order, no bundling.
          for f in _site/js/*.js; do
            npx --yes -p esbuild esbuild --minify --log-level=warning --allow-overwrite "$f" --outfile="$f"
          done
          for f in _site/css/*.css; do
            npx --yes -p esbuild esbuild --minify --log-level=warning --allow-overwrite "$f" --outfile="$f"
          done
          echo "── Post-minify sizes ──"
          du -sh _site/js _site/css
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
