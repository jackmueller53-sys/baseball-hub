name: Fetch 2026 Live Data

on:
  schedule:
    # Runs daily at 8:00 AM UTC (4 AM ET) — after west coast games finish
    - cron: '0 8 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

permissions:
  contents: write  # Needed to commit data files back to repo
  actions: write   # Needed to dispatch deploy.yml after a data commit

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the push-retry step can rebase onto origin/main
          # if a concurrent workflow (MiLB fetch) moved the branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pybaseball xgboost scikit-learn pandas numpy scipy

      - name: Fetch 2026 season data (FanGraphs + Savant)
        run: node scripts/fetch-2026.js

      - name: Compute custom Stuff+ model scores
        run: python3 scripts/compute_stuffplus.py --verbose

      - name: Check for data changes
        id: check
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data files updated:"
            git diff --cached --stat
          fi

      - name: Commit and push updated data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update 2026 data — $(date -u '+%Y-%m-%d %H:%M UTC')

          Fetched from FanGraphs API + Baseball Savant.
          Triggered by: ${{ github.event_name }}"

          # This job runs ~40 min (fetch + Stuff+ model). The MiLB fetch
          # workflow often pushes to main in that window, so a plain
          # `git push` is rejected with "fetch first". Rebase our single
          # data commit on top of whatever landed and retry a few times.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push $attempt rejected — rebasing on latest origin/main…"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 rebase attempts"
          exit 1

      # Why this step exists:
      # Commits pushed with the default GITHUB_TOKEN do NOT trigger other
      # workflows (GitHub's loop-prevention rule). deploy.yml listens on
      # `push: main`, so without this dispatch the new data files never
      # get published to GitHub Pages and the live site stays stale.
      # workflow_dispatch IS exempt from the no-trigger rule, so calling it
      # explicitly is the supported fix.
      - name: Trigger Pages deploy (deploy.yml)
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "Dispatched deploy.yml on main"
