<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Baseball Hub &mdash; Postseason</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;800;900&family=Playfair+Display:ital,wght@0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<style>
  .ps-wrap { max-width: 1240px; margin: 0 auto; padding: 22px 20px 60px; }
  .ps-head { display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; margin-bottom: 18px; }
  .ps-head h1 { font-family:'Playfair Display',serif; font-size: 30px; margin:0; color:var(--fg); }
  .ps-updated { font-family:var(--mono,'JetBrains Mono',monospace); font-size:11px; color:var(--fg3,#8a8278); }
  .ps-section { margin-bottom: 26px; }
  .ps-h { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:13px; letter-spacing:2px;
    text-transform:uppercase; color:var(--fg2,#5e574e); font-weight:700; margin-bottom:12px;
    border-bottom:1px solid var(--line,rgba(29,25,22,.1)); padding-bottom:6px; }

  /* Team chip */
  .ps-team { display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px; }
  .ps-logo { width:22px; height:22px; flex:0 0 auto; object-fit:contain; }
  .ps-abbr { font-family:'Barlow Condensed',system-ui,sans-serif; font-weight:700; font-size:16px;
    letter-spacing:.5px; color:var(--fg,#1d1916); }
  .ps-score { margin-left:auto; font-family:var(--mono,monospace); font-weight:700; font-size:16px; color:var(--fg,#1d1916); }
  .ps-team.ps-win .ps-abbr, .ps-team.ps-win .ps-score { color:#047857; }
  .ps-team:not(.ps-win) { opacity:.78; }

  /* Bracket */
  .ps-bracket { display:flex; gap:16px; overflow-x:auto; padding-bottom:6px; }
  .ps-col { flex:1 1 0; min-width:180px; display:flex; flex-direction:column; gap:14px; }
  .ps-col-h { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:11px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--fg3,#8a8278); font-weight:700; text-align:center; }
  .ps-series { background:var(--bg-card,#fff); border:1px solid var(--line,rgba(29,25,22,.1)); border-radius:10px;
    padding:8px 6px 6px; box-shadow:0 1px 2px rgba(0,0,0,.03); }
  .ps-series-done { background:rgba(4,120,87,.04); border-color:rgba(4,120,87,.18); }
  .ps-series-status { margin-top:4px; padding:4px 8px 0; font-family:'Barlow Condensed',system-ui,sans-serif;
    font-size:12px; letter-spacing:.5px; color:var(--fg2,#5e574e); border-top:1px dashed var(--line,rgba(29,25,22,.1)); }

  /* Live / game cards */
  .ps-games { display:flex; flex-wrap:wrap; gap:12px; }
  .ps-game { background:var(--bg-card,#fff); border:1px solid var(--line,rgba(29,25,22,.1)); border-radius:10px;
    padding:10px 12px; min-width:200px; flex:0 1 230px; }
  .ps-game-live { border-color:rgba(183,71,42,.5); box-shadow:0 0 0 1px rgba(183,71,42,.25); }
  .ps-game-series { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color:var(--fg3,#8a8278); margin-bottom:6px; }
  .ps-team-row { padding:3px 2px; }
  .ps-game-status { margin-top:6px; font-family:'Barlow Condensed',system-ui,sans-serif; font-size:12px;
    letter-spacing:.5px; color:var(--fg2,#5e574e); display:flex; align-items:center; gap:6px; }
  .ps-live-dot { width:8px; height:8px; border-radius:50%; background:#b7472a; display:inline-block;
    animation:ps-pulse 1.4s ease-in-out infinite; }
  @keyframes ps-pulse { 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .ps-empty { padding:40px 16px; text-align:center; color:var(--fg2,#5e574e); font-size:15px; line-height:1.6; }

  /* Clickable team chips */
  .ps-clickable { cursor:pointer; border-radius:6px; transition:background .12s; }
  .ps-clickable:hover { background:rgba(183,71,42,.08); }

  /* Team-detail modal */
  .ps-modal { position:fixed; inset:0; background:rgba(20,16,12,.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 16px; z-index:100; overflow-y:auto; }
  .ps-modal[hidden] { display:none; }
  .ps-modal-box { background:var(--bg,#fbf7ef); border-radius:14px; max-width:520px; width:100%;
    padding:22px 24px 26px; position:relative; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .ps-modal-close { position:absolute; top:12px; right:14px; background:none; border:0; font-size:26px;
    line-height:1; color:var(--fg3,#8a8278); cursor:pointer; }
  .ps-td-head { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .ps-td-logo { width:44px; height:44px; object-fit:contain; }
  .ps-td-name { font-family:'Playfair Display',serif; font-size:22px; color:var(--fg,#1d1916); }
  .ps-td-sub { font-family:var(--mono,monospace); font-size:12px; color:var(--fg2,#5e574e); }
  .ps-next { background:var(--bg-card,#fff); border:1px solid var(--line,rgba(29,25,22,.1)); border-radius:8px;
    padding:9px 12px; font-family:'Barlow Condensed',system-ui,sans-serif; font-size:14px; color:var(--fg,#1d1916); margin-bottom:14px; }
  .ps-td-h { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:12px; letter-spacing:1.5px;
    text-transform:uppercase; color:var(--fg2,#5e574e); font-weight:700; margin:16px 0 8px;
    border-bottom:1px solid var(--line,rgba(29,25,22,.1)); padding-bottom:5px; }
  .ps-lu { width:100%; border-collapse:collapse; font-family:var(--mono,monospace); font-size:13px; }
  .ps-lu td { padding:4px 0; border-bottom:1px dashed var(--line,rgba(29,25,22,.08)); }
  .ps-lu-n { width:22px; color:var(--fg3,#8a8278); }
  .ps-lu-name { color:var(--fg,#1d1916); }
  .ps-lu-pos { width:46px; text-align:right; color:var(--fg2,#5e574e); }
  .ps-note { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:12px; color:var(--fg3,#8a8278); margin-top:6px; letter-spacing:.3px; }
  .ps-stat-grp { font-family:'Barlow Condensed',system-ui,sans-serif; font-size:12px; letter-spacing:.5px;
    color:var(--fg2,#5e574e); font-weight:700; margin:10px 0 6px; }
  .ps-stat-grp em { font-style:normal; color:var(--fg3,#8a8278); font-weight:400; }
  .ps-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(78px,1fr)); gap:8px; }
  .ps-stat { background:var(--bg-card,#fff); border:1px solid var(--line,rgba(29,25,22,.08)); border-radius:7px; padding:7px 9px; }
  .ps-stat-v { display:block; font-family:var(--mono,monospace); font-weight:700; font-size:14px; color:var(--fg,#1d1916); }
  .ps-stat-l { display:block; font-family:'Barlow Condensed',system-ui,sans-serif; font-size:10px; letter-spacing:.5px;
    text-transform:uppercase; color:var(--fg3,#8a8278); margin-top:2px; }
</style>
</head>
<body>

<div id="hub-header">
  <div class="hub-hdr">
    <a class="hub-logo" href="../index.html">
      <div class="hub-logo-mark">&#9918;</div>
      <div>
        <span class="hub-logo-title">Baseball Hub</span>
        <span class="hub-logo-sub">by Jack Mueller</span>
      </div>
    </a>
    <div class="hub-divider"></div>
    <nav class="hub-nav">
      <a class="hub-tab" href="../index.html" style="text-decoration:none;display:inline-flex;align-items:center">
        <span class="hub-tab-icon">&#128202;</span> Stats Explorer
      </a>
      <a class="hub-tab" href="../index.html#stuffplus" style="text-decoration:none;display:inline-flex;align-items:center">
        <span class="hub-tab-icon">&#128300;</span> Stuff+ Leaderboard
      </a>
      <a class="hub-tab" href="milb.html" style="text-decoration:none;display:inline-flex;align-items:center">
        <span class="hub-tab-icon">&#9918;</span> MiLB
      </a>
      <a class="hub-tab active" href="postseason.html" style="text-decoration:none;display:inline-flex;align-items:center">
        <span class="hub-tab-icon">&#127942;</span> Postseason
      </a>
    </nav>
  </div>
</div>

<div class="ps-wrap">
  <div class="ps-head">
    <h1>MLB Postseason</h1>
    <span class="ps-updated" id="ps-updated">Loading live bracket&hellip;</span>
  </div>
  <div id="ps-root"><div class="ps-empty">Loading postseason&hellip;</div></div>
  <footer style="margin-top:30px;font-family:'Barlow Condensed',system-ui,sans-serif;font-size:12px;letter-spacing:.5px;color:var(--fg3,#8a8278)">
    Live data from the public <a href="https://www.mlb.com" target="_blank" rel="noopener">MLB Stats API</a>. Auto-refreshes every 45 seconds. Team logos &copy; MLB.
  </footer>
</div>

<div id="ps-modal" class="ps-modal" hidden>
  <div class="ps-modal-box">
    <button class="ps-modal-close" aria-label="Close">&times;</button>
    <div id="ps-modal-content"></div>
  </div>
</div>

<script src="../js/postseason.js"></script>
</body>
</html>
